name: Haiku Agent CI & Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      GOOGLE_CLOUD_LOCATION: "us-central1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-adk google-genai requests pydantic pytest opentelemetry-sdk

      - name: Run automated pytest and ADK evaluations
        run: |
          pytest haiku_agent/tests/evals/ -v
